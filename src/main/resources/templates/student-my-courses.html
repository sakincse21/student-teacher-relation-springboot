<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="fragments/navbar :: body"></div>
<div class="container">

<h1>My Assigned Courses</h1>

<a class="btn btn-sm btn-primary" th:href="@{/student/dashboard}">⬅ Back Dashboard</a>

<hr>

    <table class="table table-bordered table-striped table-hover">
    <thead>
    <tr>
        <th>Code</th>
        <th>Title</th>
        <th>Teacher</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="c : ${courses}">
        <td th:text="${c.courseCode}"></td>
        <td th:text="${c.courseTitle}"></td>
        <td th:text="${c.teacher.fullName}"></td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(courses)}" style="color: gray;">
    You have not been assigned any courses yet.
</p>
</div>
</body>
</html>
