<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Manage Students</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="fragments/navbar :: body"></div>
<div class="container">

<h1>Manage Students</h1>

<a class="btn btn-sm btn-primary" th:href="@{/teacher/dashboard}">⬅ Back Dashboard</a> |
<a class="btn btn-sm btn-primary" th:href="@{/teacher/students/new}">➕ Add Student</a> |
<a class="btn btn-sm btn-primary" th:href="@{/teacher/assign}">🧑‍🎓 Assign Course</a>
<hr>

<p th:if="${param.success}" style="color:green;">
  ✅ Student created successfully!
</p>

  <table class="table table-bordered table-striped table-hover">
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Roll</th>
    <th>Login</th>
    <th>Action</th>

  </tr>
  </thead>
  <tbody>
  <tr th:each="s : ${students}">
    <td th:text="${s.id}"></td>
    <td th:text="${s.name}"></td>
    <td th:text="${s.roll}"></td>
    <td th:text="${s.user != null ? s.user.username : 'No account'}"></td>
    <td>
      <form th:action="@{'/teacher/students/' + ${s.id} + '/delete'}" method="post"
            onsubmit="return confirm('Delete this student?');">
        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
      </form>
    </td>

  </tr>
  </tbody>
</table>

</div>
</body>
</html>
