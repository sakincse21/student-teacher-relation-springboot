<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="fragments/navbar :: body"></div>
<div class="container">

<h1>Add New Course</h1>

<a class="btn btn-sm btn-primary" th:href="@{/teacher/courses}">⬅ Back to Courses</a>

<hr>

<form th:action="@{/teacher/courses/new}" th:object="${course}" method="post">

    <div>
        <label>Course Code</label>
        <input type="text" th:field="*{courseCode}" placeholder="CSE-2101" required>
    </div>

    <br>

    <div>
        <label>Course Title</label>
        <input type="text" th:field="*{courseTitle}" placeholder="Data Structures" required>
    </div>

    <br>

    <button  class="btn btn-md btn-success" type="submit">Save Course</button>
</form>
</div>
</body>
</html>
