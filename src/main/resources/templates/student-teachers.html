<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teachers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="fragments/navbar :: body"></div>
<div class="container">

<h1>Teachers List</h1>

<a class="btn btn-sm btn-primary" th:href="@{/student/dashboard}">⬅ Back Dashboard</a>

<hr>

    <table class="table table-bordered table-striped table-hover">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="t : ${teachers}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.fullName}"></td>
        <td th:text="${t.email}"></td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(teachers)}" style="color: gray;">
    No teachers found.
</p>
</div>
</body>
</html>
