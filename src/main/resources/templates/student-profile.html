<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="fragments/navbar :: body"></div>
<div class="container">

<h1>My Profile</h1>

<a class="btn btn-sm btn-primary" th:href="@{/student/dashboard}">⬅ Back Dashboard</a>

<hr>

<p th:if="${param.updated}" style="color:green;">
    ✅ Profile updated successfully!
</p>

<p><b>ID:</b> <span th:text="${student.id}"></span></p>
<p><b>Name:</b> <span th:text="${student.name}"></span></p>
<p><b>Roll:</b> <span th:text="${student.roll}"></span></p>

<a th:href="@{/student/profile/edit}">✏ Edit Profile</a>
</div>
</body>
</html>
