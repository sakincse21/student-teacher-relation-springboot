<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="fragments/navbar :: body"></div>
<div class="container">
<h1>Add New Student</h1>

<a class="btn btn-sm btn-primary" th:href="@{/teacher/students}">⬅ Back to Students</a>

<hr>

<form th:action="@{/teacher/students/new}" th:object="${req}" method="post">

  <h3>Student Info</h3>
  <div>
    <label>Name</label>
    <input type="text" th:field="*{name}" required>
  </div>

  <br>

  <div>
    <label>Roll</label>
    <input type="text" th:field="*{roll}" required>
  </div>

  <hr>

  <h3>Student Login Account (Optional)</h3>
  <p style="color:gray;">If you provide username/password, student can login.</p>

  <div>
    <label>Username</label>
    <input type="text" th:field="*{username}">
  </div>

  <br>

  <div>
    <label>Password</label>
    <input type="password" th:field="*{password}">
  </div>

  <br>

  <button  class="btn btn-md btn-success" type="submit">Create Student</button>
</form>
</div>
</body>
</html>
