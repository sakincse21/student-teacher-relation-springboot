<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="fragments/navbar :: body"></div>
<div class="container">

<h1>My Courses</h1>

<a class="btn btn-sm btn-primary" th:href="@{/teacher/dashboard}">⬅ Back Dashboard</a>
|
<a class="btn btn-sm btn-primary" th:href="@{/teacher/courses/new}">➕ Add New Course</a>

<hr>
    <table class="table table-bordered table-striped table-hover">
    <thead>
    <tr>
        <th>ID</th>
        <th>Course Code</th>
        <th>Course Title</th>
        <th>Action</th>

    </tr>
    </thead>

    <tbody>
    <tr th:each="course : ${courses}">
        <td th:text="${course.id}"></td>
        <td th:text="${course.courseCode}"></td>
        <td th:text="${course.courseTitle}"></td>
        <td>
            <form th:action="@{'/teacher/courses/' + ${course.id} + '/delete'}" method="post"
                  onsubmit="return confirm('Delete this course?');">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
        </td>

    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(courses)}" style="color: gray;">
    No courses created yet.
</p>
</div>
</body>
</html>
