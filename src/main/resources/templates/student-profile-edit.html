<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="fragments/navbar :: body"></div>
<div class="container">

<h1>Edit My Profile</h1>

<a class="btn btn-sm btn-primary" th:href="@{/student/profile}">⬅ Back Profile</a>

<hr>

<form th:action="@{/student/profile/edit}" method="post">

  <div>
    <label>Name</label>
    <input type="text" name="name" th:value="${student.name}" required>
  </div>

  <br>

  <div>
    <label>Roll</label>
    <input type="text" name="roll" th:value="${student.roll}" required>
  </div>

  <br>

  <button  class="btn btn-md btn-success" type="submit">Update</button>
</form>
</div>
</body>
</html>
