<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Assign Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="fragments/navbar :: body"></div>
<div class="container">

<h1>Assign Course to Student</h1>

<a class="btn btn-sm btn-primary" th:href="@{/teacher/dashboard}">⬅ Back Dashboard</a>
|
<a class="btn btn-sm btn-primary" th:href="@{/teacher/courses}">📚 Courses</a>

<hr>

<p th:if="${param.success}" style="color:green;">
    ✅ Course assigned successfully!
</p>

<form th:action="@{/teacher/assign}" method="post">

    <div>
        <label>Select Student:</label>
        <select name="studentId" required>
            <option value="">--Select Student--</option>
            <option th:each="s : ${students}"
                    th:value="${s.id}"
                    th:text="${s.name + ' (' + s.roll + ')'}">
            </option>
        </select>
    </div>

    <br>

    <div>
        <label>Select Course:</label>
        <select name="courseId" required>
            <option value="">--Select Course--</option>
            <option th:each="c : ${courses}"
                    th:value="${c.id}"
                    th:text="${c.courseCode + ' - ' + c.courseTitle}">
            </option>
        </select>
    </div>

    <br>

    <button class="btn btn-md btn-success" type="submit">Assign</button>
</form>
</div>
</body>
</html>
